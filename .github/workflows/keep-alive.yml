name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 9 */5 * *"  # 每 5 天台北時間上午 9 點執行
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/memories?select=id&limit=1" \
            -o /dev/null -w "Status: %{http_code}\n"
